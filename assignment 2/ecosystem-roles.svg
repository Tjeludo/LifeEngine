<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Rhino leopard savanna Life Engine roles</title>
  <desc id="desc">A visual explanation of rhino, leopard, grass and bush cell silhouettes and their relationships.</desc>
  <rect width="1200" height="680" fill="#f5efe2"/>
  <rect x="32" y="32" width="1136" height="616" rx="18" fill="#fffaf0" stroke="#1e3d34" stroke-width="4"/>
  <text x="70" y="92" font-family="Georgia,serif" font-size="38" font-weight="bold" fill="#1e3d34">Rhino-Leopard Savanna</text>
  <text x="70" y="126" font-family="Arial,sans-serif" font-size="18" fill="#52645b">Cell silhouettes used in the Assignment 2 Life Engine world</text>
  <g transform="translate(90 185)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1e3d34">Rhino / herbivore</text>
    <text x="0" y="32" font-family="Arial,sans-serif" font-size="16" fill="#52645b">armour + eye + mouth + mover</text>
    <g transform="translate(60 82)">
      <rect x="72" y="42" width="44" height="44" fill="#7f86a8"/>
      <rect x="28" y="42" width="44" height="44" fill="#756e9e"/>
      <rect x="-16" y="42" width="44" height="44" fill="#756e9e"/>
      <rect x="28" y="-2" width="44" height="44" fill="#756e9e"/>
      <rect x="28" y="86" width="44" height="44" fill="#756e9e"/>
      <rect x="116" y="42" width="44" height="44" fill="#e78b45"/>
      <rect x="116" y="-2" width="44" height="44" fill="#b9b3dc"/>
      <text x="171" y="72" font-family="Arial,sans-serif" font-size="15" fill="#1e3d34">mouth</text>
      <text x="171" y="-2" font-family="Arial,sans-serif" font-size="15" fill="#1e3d34">eye</text>
    </g>
  </g>
  <g transform="translate(650 185)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1e3d34">Leopard / predator</text>
    <text x="0" y="32" font-family="Arial,sans-serif" font-size="16" fill="#52645b">killer + eye + mouth + mover</text>
    <g transform="translate(70 82)">
      <rect x="50" y="42" width="44" height="44" fill="#7f86a8"/>
      <rect x="6" y="42" width="44" height="44" fill="#756e9e"/>
      <rect x="94" y="42" width="44" height="44" fill="#db5c4f"/>
      <rect x="50" y="-2" width="44" height="44" fill="#e78b45"/>
      <rect x="94" y="-2" width="44" height="44" fill="#b9b3dc"/>
      <text x="151" y="72" font-family="Arial,sans-serif" font-size="15" fill="#1e3d34">killer</text>
      <text x="151" y="-2" font-family="Arial,sans-serif" font-size="15" fill="#1e3d34">eye</text>
    </g>
  </g>
  <line x1="600" y1="165" x2="600" y2="390" stroke="#d5cbb7" stroke-width="3"/>
  <g transform="translate(120 475)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1e3d34">Plant resources</text>
    <g transform="translate(20 42)">
      <rect x="0" y="40" width="42" height="42" fill="#61a66b"/><rect x="42" y="40" width="42" height="42" fill="#61a66b"/><rect x="84" y="40" width="42" height="42" fill="#61a66b"/>
      <text x="0" y="110" font-family="Arial,sans-serif" font-size="17" fill="#1e3d34">grass: 3 producers</text>
    </g>
    <g transform="translate(330 42)">
      <rect x="42" y="0" width="42" height="42" fill="#3e8758"/><rect x="0" y="42" width="42" height="42" fill="#3e8758"/><rect x="42" y="42" width="42" height="42" fill="#3e8758"/><rect x="84" y="42" width="42" height="42" fill="#3e8758"/><rect x="42" y="84" width="42" height="42" fill="#3e8758"/>
      <text x="0" y="155" font-family="Arial,sans-serif" font-size="17" fill="#1e3d34">bush: 5 producers</text>
    </g>
  </g>
  <g transform="translate(760 485)">
    <path d="M0 28 C70 -10 135 2 185 42" fill="none" stroke="#c1783e" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="18" fill="#1e3d34">plants produce food</text>
    <text x="0" y="92" font-family="Arial,sans-serif" font-size="18" fill="#1e3d34">rhinos eat food</text>
    <text x="0" y="126" font-family="Arial,sans-serif" font-size="18" fill="#1e3d34">leopards damage organisms</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c1783e"/></marker></defs>
</svg>