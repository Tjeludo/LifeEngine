<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Qualitative short-run observation graph</title>
  <desc id="desc">A graph showing increasing visible resource coverage and continuing animal presence across four short-run stages.</desc>
  <rect width="900" height="520" fill="#fffaf0"/>
  <text x="55" y="55" font-family="Georgia,serif" font-size="30" font-weight="bold" fill="#1e3d34">Short-run stage observations</text>
  <text x="55" y="84" font-family="Arial,sans-serif" font-size="15" fill="#52645b">Qualitative visual index from screenshots, not exact population telemetry</text>
  <line x1="100" y1="420" x2="830" y2="420" stroke="#1e3d34" stroke-width="2"/><line x1="100" y1="130" x2="100" y2="420" stroke="#1e3d34" stroke-width="2"/>
  <text x="140" y="455" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">Initial</text><text x="315" y="455" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">Early</text><text x="485" y="455" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">Middle</text><text x="655" y="455" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">Later</text>
  <polyline points="160,360 335,315 505,235 675,185" fill="none" stroke="#15b957" stroke-width="6"/><circle cx="160" cy="360" r="8" fill="#15b957"/><circle cx="335" cy="315" r="8" fill="#15b957"/><circle cx="505" cy="235" r="8" fill="#15b957"/><circle cx="675" cy="185" r="8" fill="#15b957"/>
  <polyline points="160,335 335,335 505,300 675,300" fill="none" stroke="#7230db" stroke-width="6"/><circle cx="160" cy="335" r="8" fill="#7230db"/><circle cx="335" cy="335" r="8" fill="#7230db"/><circle cx="505" cy="300" r="8" fill="#7230db"/><circle cx="675" cy="300" r="8" fill="#7230db"/>
  <rect x="555" y="105" width="16" height="16" fill="#15b957"/><text x="580" y="119" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">plants/food coverage</text><rect x="755" y="105" width="16" height="16" fill="#7230db"/><text x="780" y="119" font-family="Arial,sans-serif" font-size="14" fill="#1e3d34">animals remain present</text>
  <text x="100" y="490" font-family="Arial,sans-serif" font-size="13" fill="#52645b">Interpretation: resources visibly rise while animals persist; this is correlation, not proof of causation.</text>
</svg>